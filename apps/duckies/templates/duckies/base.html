{% load static %}
<!doctype html>
<html lang="es">

<head>

    <title>{% block title %}Duckies{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'duckies/css/base.css' %}">
</head>

<body>
    <header>
        <h1>Duckies</h1>
        <nav><a href="{% url 'duckies:detail' %}">Mi Ducky</a> <a href="{% url 'duckies:inventory' %}">Inventario</a> <a

</html>
