{% extends 'team5_ui/base.html' %}{% block content %}<div class="dark-panel"><h1>Tienda</h1><div class="catalog-grid">{% for offer in offers %}<div class="product-card"><h2>{{ offer.name }}</h2><p>{{ offer.description }}</p><p>🪙 {{ offer.price_coins }}</p><form action="{% url 'shop:buy' %}" method="post">{% csrf_token %}<input type="hidden" name="code" value="{{ offer.code }}"><button class="btn gold">Comprar</button></form></div>{% empty %}<p>Catálogo vacío</p>{% endfor %}</div></div>{% endblock %}
